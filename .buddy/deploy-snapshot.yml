- pipeline: "Deploy Snapshot"
  fail_on_prepare_env_warning: true
  actions:
  - action: "Publish Snapshot"
    type: "BUILD"
    docker_image_name: "library/eclipse-temurin"
    docker_image_tag: "21-jdk"
    execute_commands:
    - "export ANDROID_HOME=\"/opt/android/sdk\""
    - "export PATH=$PATH:/opt/android/sdk/cmdline-tools/tools/bin"
    - "if [ ! -d \"$ANDROID_HOME/cmdline-tools\" ]; then"
    - " curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip"
    - " unzip sdk.zip"
    - " rm sdk.zip"
    - " mkdir \"$ANDROID_HOME/cmdline-tools\""
    - " mv cmdline-tools \"$ANDROID_HOME/cmdline-tools/tools\""
    - " yes | \"$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager\" --licenses"
    - "fi"
    - ""
    - "chmod +x gradlew"
    - "export ORG_GRADLE_PROJECT_signingKey=\"$(cat /buddy-variables/cismartcar_com_pgp)\""
    - ""
    - "# Derive a snapshot version from the committed libVersion instead of"
    - "# requiring it to be edited in gradle.properties beforehand — strips any"
    - "# existing -SNAPSHOT suffix first so re-running this pipeline is idempotent."
    - "BASE_VERSION=$(cat smartcar-auth/gradle.properties | grep -E '^libVersion=.*$' | sed 's/^libVersion=//')"
    - "SNAPSHOT_VERSION=\"${BASE_VERSION%-SNAPSHOT}-SNAPSHOT\""
    - "echo \"Publishing snapshot $SNAPSHOT_VERSION\""
    - ""
    - "./gradlew --no-configuration-cache --no-daemon -x :smartcar-auth:commonizeNativeDistribution -Pkotlin.native.ignoreDisabledTargets=true -PskipDokkaForPublish=true -PlibVersion=$SNAPSHOT_VERSION publishAndroidReleasePublicationToSonatypeRepository"
    setup_commands:
    - "apt-get update && apt-get install -y unzip findutils"
    cached_dirs:
    - "/root/.gradle"
    - "/opt/android/sdk"
    shell: "BASH"
